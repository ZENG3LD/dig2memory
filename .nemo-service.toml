[service]
name = "dig2memory-server"
kind = "service"
display_name = "dig2memory"
description = "AST index + dependency graph + fuzzy search server (port 18200)"

[links]
local_url = "http://127.0.0.1:18200"
docs = "dig2memory/README.md"

[[endpoints]]
method = "GET"
path = "/health"
description = "Server health and index stats"
auth = "none"
public = true

[[endpoints]]
method = "POST"
path = "/index"
description = "Trigger (re-)indexing of a workspace"
auth = "none"
public = true
body_schema = '{"workspace_id":"string","root_path":"string","workspace_name":"string","force":"bool"}'

[[endpoints]]
method = "GET"
path = "/ast/search"
description = "Fuzzy symbol search by name (?q=NAME)"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/ast/symbols"
description = "List all symbols in a file (?file=PATH&workspace=WS)"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/ast/callers"
description = "Find callers of a symbol (?sym=NAME&workspace=WS)"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/ast/deps"
description = "File dependency list (?file=PATH&workspace=WS)"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/graph/crates"
description = "Crate dependency tree (?workspace=WS)"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/graph/impact"
description = "Impact analysis — what breaks if this file changes (?file=PATH&workspace=WS)"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/graph/hotspots"
description = "Most-connected modules (?workspace=WS)"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/graph/resolve"
description = "Resolve which crate owns a symbol (?sym=NAME&workspace=WS)"
auth = "none"
public = true

[[manage_actions]]
id = "reindex"
label = "Re-index nemo workspace"
description = "Trigger incremental re-index of the nemo workspace (force=false)"
method = "POST"
path = "/index"
auth = "none"
confirm = false
mode = "async"
timeout_secs = 600
body = '{"workspace_id":"nemo","workspace_name":"nemo","root_path":"c:/Users/VA PC/CODING/ML_TRADING/nemo","force":false}'
content_type = "application/json"

[[manage_actions]]
id = "search_symbol"
label = "Fuzzy search symbol"
description = "Find functions/structs/traits by name. Params: {q}"
method = "GET"
path = "/ast/search?q={q}&workspace=nemo"
auth = "none"
confirm = false
timeout_secs = 30
[[manage_actions.params_schema]]
name = "q"
required = true
example = "AppState"
description = "Symbol name to fuzzy-search"

[[manage_actions]]
id = "find_callers"
label = "Find callers of symbol"
description = "List all callers of a symbol. Params: {sym}"
method = "GET"
path = "/ast/callers?sym={sym}&workspace=nemo"
auth = "none"
confirm = false

[[manage_actions]]
id = "resolve_symbol"
label = "Resolve crate owning symbol"
description = "Which crate defines this symbol. Params: {sym}"
method = "GET"
path = "/graph/resolve?sym={sym}&workspace=nemo"
auth = "none"
confirm = false

[[manage_actions]]
id = "impact_analysis"
label = "Impact analysis for file"
description = "What breaks if this file changes. Params: {file}"
method = "GET"
path = "/graph/impact?file={file}&workspace=nemo"
auth = "none"
confirm = false
mode = "async"
timeout_secs = 300
[[manage_actions.params_schema]]
name = "file"
required = true
example = "mylittlechart/crates/indicators/src/bar_indicators/mod.rs"
description = "Workspace-relative file path"

[[manage_actions]]
id = "hotspots"
label = "Most-connected modules"
description = "Hotspot modules in the graph (no params)"
method = "GET"
path = "/graph/hotspots?workspace=nemo"
auth = "none"
confirm = false

[[manage_actions]]
id = "crate_tree"
label = "Crate dependency tree"
description = "Full crate dependency graph (no params)"
method = "GET"
path = "/graph/crates?workspace=nemo"
auth = "none"
confirm = false

[health]
endpoint = "/health"
