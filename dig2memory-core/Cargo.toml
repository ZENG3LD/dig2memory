[package]
name = "dig2memory-core"
version = "0.1.0"
edition = "2021"

[features]
watcher = ["dep:notify"]

[dependencies]
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
cargo_metadata = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
notify = { version = "6", optional = true }
