[package]
name = "dig2memory-cli"
version = "0.1.2"
edition = "2021"
description = "Code intelligence CLI — query the dig2memory AST index from the command line"
license = "MIT"
repository = "https://github.com/ZENG3LD/dig2memory"

[[bin]]
name = "dig2memory"
path = "src/main.rs"

[dependencies]
dig2memory-core = { path = "../dig2memory-core", version = "0.1.2", features = ["lang-typescript", "lang-python", "lang-go"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
