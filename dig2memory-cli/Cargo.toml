[package]
name = "dig2memory-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dig2memory"
path = "src/main.rs"

[dependencies]
dig2memory-core = { path = "../dig2memory-core", features = ["lang-typescript", "lang-python", "lang-go"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
