[package]
name = "dig2memory-server"
version = "0.1.1"
edition = "2021"
description = "Code intelligence server — AST index + dependency graph HTTP API"
license = "MIT"
repository = "https://github.com/ZENG3LD/dig2memory"

[[bin]]
name = "dig2memory-server"
path = "src/main.rs"

[dependencies]
dig2memory-core = { path = "../dig2memory-core", version = "0.1.1", features = ["lang-typescript", "lang-python", "lang-go"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
